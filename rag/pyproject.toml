[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "ragas>=0.4",
    "httpx>=0.27",
    "datasets",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." (rag/ root) se añade en C1.1 para que las pruebas puedan importar el
# paquete `evaluation/` (diagnóstico RRF) igual que ya importan `rag` vía
# "backend" — no cambia qué pruebas se descubren (testpaths sigue apuntando
# solo a tests/), solo qué queda en sys.path durante la colección.
pythonpath = ["backend", "."]
addopts = "-v --tb=short"
markers = [
    "integration: tests that require live external services (Chroma, Ollama, Gemini)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["rag"]

[[tool.mypy.overrides]]
module = ["boto3", "rank_bm25"]
ignore_missing_imports = true
