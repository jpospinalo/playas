[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
# langchain-community queda fijado en 0.3.31 (solo en este grupo dev, nunca
# en producción): la versión de ragas actualmente bloqueada en uv.lock
# (0.4.3) importa `ChatVertexAI` desde
# `langchain_community.chat_models.vertexai`, símbolo que langchain-community
# retiró a partir de 0.4.x. langchain-community 0.3.31 sigue exponiendo ese
# símbolo, así que `import ragas` funciona con este pin sin tocar el propio
# ragas ni añadir langchain-google-vertexai. Ver evaluation/ragas_common.py
# y docs/SCRIPTS.md para más contexto.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "ragas>=0.4",
    "langchain-community==0.3.31",
    "httpx>=0.27",
    "datasets",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." (rag/ root) se añade para que las pruebas puedan importar el paquete
# `evaluation/` (diagnóstico RRF) igual que ya importan `rag` vía "backend"
# — no cambia qué pruebas se descubren (testpaths sigue apuntando solo a
# tests/), solo qué queda en sys.path durante la colección.
pythonpath = ["backend", "."]
addopts = "-v --tb=short"
markers = [
    "integration: tests that require live external services (Chroma, Ollama, Gemini)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["rag"]

[[tool.mypy.overrides]]
module = ["boto3", "rank_bm25"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `datasets` (usado solo por evaluation/ragas_common.py para construir el
# Dataset que consume RAGAS) no publica stubs ni marcador py.typed.
module = ["datasets", "datasets.*"]
ignore_missing_imports = true
