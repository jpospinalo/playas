name: CI

on:
  push:
    # main es la rama de integración activa. v2 se conserva en el disparador
    # por compatibilidad, aunque no recibe trabajo activo actualmente.
    branches: [main, develop, v2]
  pull_request:
    branches: [main]

jobs:
  ingesta-quality:
    name: Ingesta — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingesta
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "ingesta/uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check ingest/ tests/

      - name: Ruff format check
        run: uv run ruff format --check ingest/ tests/

  ingesta-test:
    name: Ingesta — Unit Tests
    runs-on: ubuntu-latest
    needs: ingesta-quality
    defaults:
      run:
        working-directory: ingesta
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "ingesta/uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ --cov=ingest --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ingesta/coverage.xml
          flags: ingesta
          fail_ci_if_error: false

  rag-quality:
    name: RAG — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "rag/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev

      - name: Ruff lint
        run: uv run ruff check backend/rag/ tests/ evaluation/ scripts/ utils/

      - name: Ruff format check
        run: uv run ruff format --check backend/rag/ tests/ evaluation/ scripts/ utils/

      # Mypy de este job comprueba backend/rag/.
      # Mypy global de ingesta se verifica por separado; sus imports de
      # boto3/botocore carecen de stubs en el entorno de ingesta.
      - name: Mypy
        run: uv run mypy backend/rag/

  rag-test:
    name: RAG — Unit Tests
    runs-on: ubuntu-latest
    needs: rag-quality
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "rag/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ --cov=rag --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: rag/coverage.xml
          flags: rag
          fail_ci_if_error: false

  rag-frontend-quality:
    name: RAG Frontend — Lint, Typecheck, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
