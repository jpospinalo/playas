name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ingesta-quality:
    name: Ingesta — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingesta
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check ingest/ tests/

      - name: Ruff format check
        run: uv run ruff format --check ingest/ tests/

  ingesta-test:
    name: Ingesta — Unit Tests
    runs-on: ubuntu-latest
    needs: ingesta-quality
    defaults:
      run:
        working-directory: ingesta
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ --cov=ingest --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ingesta/coverage.xml
          flags: ingesta

  rag-quality:
    name: RAG — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check backend/rag/ tests/ evaluation/

      - name: Ruff format check
        run: uv run ruff format --check backend/rag/ tests/ evaluation/

  rag-test:
    name: RAG — Unit Tests
    runs-on: ubuntu-latest
    needs: rag-quality
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ --cov=rag --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: rag/coverage.xml
          flags: rag
